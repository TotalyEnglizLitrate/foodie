[project]
name = "foodie"
version = "0.1.0"
description = "A unified Swiggy/Zomato tui"
readme = "README.md"
authors = [
    { name = "Narendra S", email = "narendra.s1232@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "segno>=1.6.6",
    "textual>=8.2.8",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"
